# hyprpaper 0.8 configuration, linked into ~/.config/hypr/hyprpaper.conf
# by install.sh (design/desktop). The wallpaper is the versioned image
# config/hypr/wallpaper.png, linked next to this file.

splash = false

wallpaper {
    monitor  =
    path     = ~/.config/hypr/wallpaper.png
    fit_mode = cover
}
