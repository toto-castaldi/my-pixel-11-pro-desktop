# hyprlock 0.9 configuration, linked into ~/.config/hypr/hyprlock.conf
# by install.sh (design/desktop). The password is checked through PAM
# (/etc/pam.d/hyprlock, shipped by the Debian package).
# Blur is off to keep the load on the virtualized GPU low.

$font = DejaVu Sans

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(33ccffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)
    font_color = rgb(220, 220, 220)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

# Numeric formats only: the VM has just the C.UTF-8 locale.
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(230, 230, 230)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%d/%m/%Y"
    font_size = 25
    font_family = $font
    color = rgb(230, 230, 230)
    position = -30, -150
    halign = right
    valign = top
}
