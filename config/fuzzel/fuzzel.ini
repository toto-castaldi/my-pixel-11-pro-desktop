# fuzzel configuration (design/desktop): application launcher, opened with ALT + Space.
[main]
font=DejaVu Sans:size=12
terminal=foot -e
prompt="> "
width=40
lines=12

[colors]
background=1e1e2eee
text=cdd6f4ff
match=33ccffff
selection=33ccffff
selection-text=1e1e2eff
border=33ccffff

[border]
width=2
radius=6
